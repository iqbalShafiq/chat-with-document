services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

  qdrant:
    # Keep the local server on the same minor line as @qdrant/js-client-rest
    # pulled by Anvia; the client rejects drift greater than one minor.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
