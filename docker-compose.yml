services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
